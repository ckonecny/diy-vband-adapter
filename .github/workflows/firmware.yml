# Builds the firmware for both boards on every push and pull request.
# Pushing a tag like v1.0.0 also publishes a GitHub release with ready-to-flash
# .uf2 files, so nobody needs a build environment to make an adapter.
name: Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        run: pio run -e seeed_xiao -e rp2040_zero

      - name: Collect UF2 files
        run: |
          mkdir dist
          python3 tools/bin2uf2.py .pio/build/seeed_xiao/firmware.bin
          cp .pio/build/seeed_xiao/firmware.uf2 dist/diy-vband-xiao-samd21.uf2
          cp .pio/build/rp2040_zero/firmware.uf2 dist/diy-vband-rp2040-zero.uf2
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/*.uf2

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.uf2 \
            --title "$GITHUB_REF_NAME" \
            --notes "Ready-to-flash firmware with the default settings (Left Ctrl = dit, Right Ctrl = dah). See the README section *Quick start: flash the ready-made firmware*."
