; PlatformIO builds for the DIY VBAND Adapter.
; Each board has its own Arduino-IDE-compatible sketch folder under firmware/,
; so both PlatformIO and the Arduino IDE work.
;
;   pio run -e seeed_xiao      Seeed Studio XIAO SAMD21
;   pio run -e rp2040_zero     Waveshare RP2040-Zero

[platformio]
src_dir = firmware
default_envs = seeed_xiao

; --- Seeed Studio XIAO SAMD21 ----------------------------------------------
[env:seeed_xiao]
platform = atmelsam
board = seeed_xiao
framework = arduino
build_src_filter = -<*> +<xiao_samd21/>
lib_deps =
    arduino-libraries/Keyboard
; The default ARM toolchain of the atmelsam platform is x86_64 only and fails
; on Apple Silicon without Rosetta ("Bad CPU type"). GCC 12.3 has native
; builds for macOS arm64, Linux and Windows.
platform_packages =
    toolchain-gccarmnoneeabi@~1.120301.0

; --- Waveshare RP2040-Zero -------------------------------------------------
; Uses the Arduino-Pico core by Earle Philhower. Its built-in Keyboard library
; provides USB HID, so Keyboard must NOT be listed in lib_deps here.
; The build produces firmware.uf2 directly (see README for flashing).
[env:rp2040_zero]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2040_zero
framework = arduino
board_build.core = earlephilhower
build_src_filter = -<*> +<rp2040_zero/>
lib_deps =
    adafruit/Adafruit NeoPixel

; Examples for overriding the defaults (see the top of each sketch):
;build_flags =
;    -D SWAP_PADDLES=1
;    -D KEY_DIT=0x5B   ; '['
;    -D KEY_DAH=0x5D   ; ']'
